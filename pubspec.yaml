name: kyndrel
description: "A modern desktop video player on libmpv."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  cupertino_icons: ^1.0.8
  dbus: ^0.7.15
  desktop_drop: ^0.8.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_volume_controller: ^2.0.2
  http: ^1.6.0
  intl: ^0.20.3
  material_ui: ^1.1.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  multicast_dns: ^0.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.6
  screen_brightness: ^2.1.11
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.6
  # 0.7.x is a rewrite on nativeapi whose native-assets build fails here;
  # stay on the 0.5.x API until that settles.
  window_manager: ^0.5.1
  xml: ^7.1.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/shaders/
    - assets/fonts/OFL.txt
    - assets/fonts/NotoSansArabic-OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf

hooks:
  user_defines:
    sqlite3:
      # Linux uses the system library (libsqlite3.so, from libsqlite3-dev or
      # shipped by the Linux package, task 5.6). Windows and macOS bundle the
      # package's prebuilt SQLite.
      source:
        linux: system
