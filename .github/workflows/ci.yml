name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Licence audit (ATTRIBUTION.md up to date, no incompatible licences)
        run: python3 scripts/licence_audit.py --check
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  engine:
    # PlayerService against the real libmpv with generated media.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # A stuck package mirror fails fast instead of eating the job.
      - timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libmpv-dev libsqlite3-dev ffmpeg python3-pil
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: scripts/make_test_media.sh
      # Expanded output names each test, so a hang shows where it is.
      # One file at a time: two test processes each running libmpv at
      # once deadlock on the 2-core runner (every later test then hangs).
      - run: flutter test -t engine --run-skipped -r expanded --timeout 120s --concurrency=1 test/engine

  perf-linux:
    # The resource budget (task 8.12, perf/budget.env): a release build,
    # idle and playing, under Xvfb. Reports only until a baseline is
    # recorded from these runners (scripts/measure_perf.sh ... --record,
    # committed as perf/baseline-linux.env); then drop continue-on-error.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libmpv-dev libsqlite3-dev ffmpeg python3-pil xvfb clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: scripts/make_test_media.sh
      - run: scripts/measure_perf.sh linux build/linux/x64/release/bundle/kyndrel

    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: kyndrel-windows-${{ github.sha }}
          path: build/windows/x64/runner/Release/

  build-android:
    # Android APKs (Phase 6). This container has no Android SDK; the
    # runner does.
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: kyndrel-android-arm64-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  android-emulator:
    # Smoke test on an emulator (task 6.8): the real app plays a clip served
    # from this runner, then swipes, previews and opens the subtitles.
    runs-on: ubuntu-latest
    needs: build-android
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Test media
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg python3-pil
          scripts/make_test_media.sh
      - name: Serve test media
        run: |
          cd test_media/generated
          nohup python3 -m http.server 8000 > /tmp/http.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: flutter test integration_test/android_smoke_test.dart -r expanded

  build-macos:
    # Compiles the Swift runner code (Open with, Now Playing).
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter build macos --debug
